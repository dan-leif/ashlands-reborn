## How green terrain transitions into ash/lava. Legacy = original binary stamp (exact previous behavior). LegacySmooth = green blends straight into ash across one smooth organic fade (no mud stage; a soft warm mid-fade tinge replaces Legacy's hard yellow fringe). MudBlend = grass -> scorched mud -> ash -> lava multi-band fade with organic noisy edges. AshBlend = MudBlend's fade geometry but the mud renders as ash (green fades directly into ash - no swamp texture, no yellow). RockBlend = GrassToLava's tight rim rendered as gray rock (the dug-rock-strip look). GrassToLava = grass runs almost to the lava rivers with a tight mud/ash rim. DebugGradient = dev calibration strips. Changing this live-rebuilds nearby terrain.
# Setting type: String
# Default value: LegacySmooth
# Acceptable values: Legacy, LegacySmooth, MudBlend, AshBlend, RockBlend, GrassToLava, DebugGradient
TerrainTransitionStyle = LegacySmooth

## World-space frequency of the transition edge-breakup noise (lower = larger wobbles). Ignored by Legacy.
# Setting type: Single
# Default value: 0.08
# Acceptable value range: From 0.01 to 0.5
TransitionNoiseScale = 0.08

## How far transition band thresholds are jittered (lava-mask units). 0 = perfectly smooth contour lines. Ignored by Legacy.
# Setting type: Single
# Default value: 0.08
# Acceptable value range: From 0 to 0.3
TransitionNoiseStrength = 0.08

## Vertices of box-blur applied to the lava mask before banding (kills the stair-step grid look). Ignored by Legacy.
# Setting type: Int32
# Default value: 2
# Acceptable value range: From 0 to 4
TransitionBlurRadius = 2

## Lava-mask level at/above which terrain always renders as full vanilla ash, evaluated on the RAW unblurred mask, so the shader's glowing lava rim/cracks and the deadly lava boundary stay exactly vanilla (lava is lethal above 0.6). Lower = more vanilla ash retained around lava. Ignored by Legacy and DebugGradient.
# Setting type: Single
# Default value: 0.2
# Acceptable value range: From 0.05 to 0.55
TransitionAshHold = 0.2

## Width (lava-mask units) of the MudBlend green -> mud -> ash fade band below the ash hold. Smaller = narrower mud band. Ignored by the other styles.
# Setting type: Single
# Default value: 0.15
# Acceptable value range: From 0.05 to 0.5
TransitionFadeWidth = 0.15

## AshBlend only (dev tuning): comma-separated dstSlice:srcSlice pairs copied inside the cloned terrain diffuse texture array, so the listed layers render as another layer's texture. Default 3:13 = the swamp/mud overlay (slice 3) renders as the lighter ash-pair texture (slice 13), which blends smoothly into the pale full-ash zone at the lava rim; 3:7 (main ash) is darker/dramatic but shows the binary ash-hold contour as high-contrast 1m steps. Recon in SHADER_SLICE_MAPPING.md. Changing this rebuilds the patched array and refreshes nearby terrain.
# Setting type: String
# Default value: 3:13
AshBlendSwapSlices = 3:13

## AshBlend only: brightness multiplier applied to the swapped-in band texture (byte space). The full-ash zone renders a per-pixel 7+13 blend plus the variation overlay, so any single stock slice reads darker than it - grade the band up until it tonally matches the adjacent full-ash ground. The default pairs with the default AshBlendBandTint for an effective (1.23, 1.30, 1.43) per-channel lift, measured within ~1% mean luminance of the adjacent full-ash zone (v4 run-1 calibration). 1.0 with a white tint = untouched slice (byte-identical compressed clone path). Live rebuild.
# Setting type: Single
# Default value: 1.43
# Acceptable value range: From 0.25 to 2.5
AshBlendBandBrightness = 1.43

## AshBlend only: color multiplier applied to the band texture after AshBlendBandBrightness (white = no tint). The default cools the band - at matched brightness the raw slice reads warmer (R +7%, B -11%) than the blue-gray full-ash zone (v4 run-1 measurement). Components must stay <= 1 (Color configs clamp on save); put any overall lift into AshBlendBandBrightness instead. Live rebuild.
# Setting type: Color
# Default value: DBE8FFFF
AshBlendBandTint = DBE8FFFF

## AshBlend only: fraction of the grass slice (0) blended into the band texture before grading - a 'singed grass' bridge that is by construction tonally between the two sides. 0 = pure ash band. Live rebuild.
# Setting type: Single
# Default value: 0
# Acceptable value range: From 0 to 1
AshBlendBandMix = 0

## AshBlend only: _AshlandsVariationCol tint for the slice-15 variation overlay in the full-ash zone. The default olive matches every other styled path; a lighter color brightens the ash side toward the band tone. Live rebuild.
# Setting type: Color
# Default value: 66804CFF
AshBlendVariationColor = 66804CFF

## RockBlend only: comma-separated dstSlice:srcSlice pairs for the cloned terrain diffuse array. Default 3:5 = the swamp/mud overlay renders as the base-rock-scales texture, matching the pickaxe-dug rock strip the transition imitates. 3:4 / 3:14 = cliff textures, 3:12 = lighter rubble. Live rebuild.
# Setting type: String
# Default value: 3:5
RockBlendSwapSlices = 3:5

## RockBlend only: brightness multiplier for the rock band texture (see AshBlendBandBrightness). 1.0 = untouched slice. Live rebuild.
# Setting type: Single
# Default value: 1
# Acceptable value range: From 0.25 to 2.5
RockBlendBandBrightness = 1

## RockBlend only (dev comparison): use MudBlend's wide TransitionFadeWidth band geometry instead of GrassToLava's tight rim. Live rebuild.
# Setting type: Boolean
# Default value: false
RockBlendWideBand = false

## LegacySmooth only: comma-separated dstSlice:srcSlice pairs for the cloned terrain diffuse array. The mid-fade of the green->ash diagonal carries partial Plains weight, which renders the khaki slice 8 as a yellow line floating inside otherwise-green ground; the default '8:0' overwrites it with the meadows grass texture that surrounds it. '8:0,3:0' also renders the weak swamp-mud overlay (same mid-fade window) as grass - visually near-identical, but slice 3 doubles as the hoe-path texture, so paths would render grassy. Empty = vanilla array (the yellow line returns). Live rebuild.
# Setting type: String
# Default value: 8:0
LegacySmoothSwapSlices = 8:0

## LegacySmooth only: weight of the meadows grass texture (slice 0) in the line-slice mix. The swapped-in LegacySmoothSwapSlices content is a weighted average of grass/ash/mud/khaki (weights normalized by their sum; all zero = pure grass): pure grass reads slightly MORE saturated than the grass-diluted-with-ash ground the old plains line inhabits, so diluting the line texture the same way makes it vanish. Live rebuild.
# Setting type: Single
# Default value: 0.65
# Acceptable value range: From 0 to 1
LegacySmoothLineGrass = 0.65

## LegacySmooth only: weight of the light ash texture (slice 13 - the tonal-family pick, not near-black slice 7) in the line-slice mix. See LegacySmoothLineGrass. Live rebuild.
# Setting type: Single
# Default value: 0.25
# Acceptable value range: From 0 to 1
LegacySmoothLineAsh = 0.25

## LegacySmooth only: weight of the swamp mud texture (slice 3) in the line-slice mix. See LegacySmoothLineGrass. Live rebuild.
# Setting type: Single
# Default value: 0.05
# Acceptable value range: From 0 to 1
LegacySmoothLineMud = 0.05

## LegacySmooth only: weight of the plains khaki texture (slice 8 - a little of the original overlay back) in the line-slice mix. See LegacySmoothLineGrass. Live rebuild.
# Setting type: Single
# Default value: 0.05
# Acceptable value range: From 0 to 1
LegacySmoothLineKhaki = 0.05

