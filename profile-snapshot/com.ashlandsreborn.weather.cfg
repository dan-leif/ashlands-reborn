## Replace the Morgen's bone-horror visuals with a giant, self-animating donor creature (FableBunnyDonor, default Hare). Gameplay (attacks, hitboxes, drops, AI) is untouched - only the look changes.
# Setting type: Boolean
# Default value: true
EnableFableBunny = true

## Creature prefab whose visuals stand in for the Morgen. Quadruped/beast prefabs work best (Hare, Lox, Wolf, Deer). Changing this live rebuilds all swapped Morgens.
# Setting type: String
# Default value: Hare
FableBunnyDonor = Hare

## Target standing height (meters) for the donor visual, before star scaling. An absolute target is used because the Morgen's live render bounds are pose-inflated (recon measured 9.4m mid-animation) and would produce an absurdly huge donor.
# Setting type: Single
# Default value: 4
# Acceptable value range: From 1.5 to 10
FableBunnyHeight = 4

## Multiplier on the FableBunnyHeight-derived scale for the primary donor. 1.0 = exact height match.
# Setting type: Single
# Default value: 1
# Acceptable value range: From 0.25 to 3
FableBunnyScale = 1

## Vertical offset (meters) for the donor visual after ground alignment.
# Setting type: Single
# Default value: 0
# Acceptable value range: From -2 to 2
FableBunnyYOffset = 0

## Strength of the procedural attack pounce (squash-stretch + lunge pitch). 0 disables it.
# Setting type: Single
# Default value: 1
# Acceptable value range: From 0 to 3
FableBunnyPounceAmplitude = 1

## Hide the Morgen ragdoll's renderers on death so the bone corpse never shows. Vanilla death effects, despawn timing, and drops are untouched.
# Setting type: Boolean
# Default value: true
FableBunnyHideRagdoll = true

## Apply the donor creature's star-level tint regardless of the Morgen's real level (0 = base look, 1 = 1-star, 2 = 2-star). Purely visual, for comparing looks - real star scaling stays independent. Changing this live rebuilds swapped Morgens.
# Setting type: Int32
# Default value: 0
# Acceptable value range: From 0 to 2
FableBunnyStarLook = 0

## Animator speed while the donor is moving (1 = authored speed). At giant scale the authored run cycle paddles faster than the ground actually covered ('moonwalking'); slowing the animation as locomotion speed rises fixes the read. Idle animations always play at full speed.
# Setting type: Single
# Default value: 0.55
# Acceptable value range: From 0.2 to 1.5
FableBunnyMoveAnimSpeed = 0.55

## How the Morgen's left/right swipe attacks read on the donor (they are invisible otherwise - the donor has no matching limbs). Paws = the donor sits up and strikes with the front paw matching the side the Morgen is lashing from (procedural bone layer). Wisps = the striking-side wisp orb telegraphs at the hidden hand, then lashes along the real swing (no comet trail). Comets = the original both-orb flare + streaking-trail lash. Off = body pounce only.
# Setting type: String
# Default value: Paws
