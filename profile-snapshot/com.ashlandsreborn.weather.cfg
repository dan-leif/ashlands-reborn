[Fable Archer]

## How the Charred_Archer is dressed (also the archer's on/off switch):
## Disabled = no puppet, the Charred renders 100% vanilla.
## ClonePlayer = copy the player's body + armor AND the player's equipped weapon.
## CustomEquipment = copy the player's body only and equip the FableArcher Helmet/Chest/Legs/Shoulders/Weapon item IDs from this section.
# Setting type: String
# Default value: CustomEquipment
# Acceptable values: Disabled, ClonePlayer, CustomEquipment
EnableFableArcher = CustomEquipment

## Multiplier on the auto-computed height-match scale for the Fable Archer puppet. 1.0 = auto scale.
# Setting type: Single
# Default value: 1
# Acceptable value range: From 0.5 to 2
FableArcherScale = 1

## CustomRace only: body sex (model) for the Fable Archer. Beards only render on Male.
# Setting type: String
# Default value: Female
# Acceptable values: Male, Female
FableArcherSex = Female

## CustomEquipment only: item prefab name equipped in the archer's helmet slot (empty = bare head). Must exist in ObjectDB.
# Setting type: String
# Default value: norahhelmalt
FableArcherHelmet = norahhelmalt

## Fine-tune multiplier on the archer puppet's helmet size (on top of the rig normalization). 1.0 = exact fit at puppet scale.
# Setting type: Single
# Default value: 1
# Acceptable value range: From 0.5 to 2
FableArcherHelmetScale = 1

## CustomEquipment only: item prefab name equipped in the archer's chest slot (empty = bare chest). Must exist in ObjectDB.
# Setting type: String
# Default value: norahchest
FableArcherChest = norahchest

## CustomEquipment only: item prefab name equipped in the archer's legs slot (empty = bare legs). Must exist in ObjectDB.
# Setting type: String
# Default value: norahlegs
FableArcherLegs = norahlegs

## CustomEquipment only: item prefab name equipped in the archer's shoulder/cape slot (empty = none). Must exist in ObjectDB.
# Setting type: String
# Default value: 
FableArcherShoulders = 

## CustomEquipment only: item prefab name the Fable Archer carries in its LEFT hand (empty = empty hand). Default BowAshlands. Must exist in ObjectDB.
# Setting type: String
# Default value: BowAshlands
FableArcherWeapon = BowAshlands

## CustomEquipment only: multiplier on the archer's weapon size, applied after the weapon is normalized to scale with the puppet rig. 1.0 = fits like it fits the player.
# Setting type: Single
# Default value: 1.3
# Acceptable value range: From 0.25 to 4
FableArcherWeaponScale = 1.3

## Keep the Fable Archer's mouth closed: skip retargeting the Charred's animated Jaw bone onto the puppet, so the puppet jaw stays at the player rig's bind pose. Off = vanilla behavior (the Charred's gaping jaw animation drives the puppet mouth).
# Setting type: Boolean
# Default value: true
FableArcherCloseMouth = true

## Give the Fable Archer the vanilla Charred eye glow, recolored white: the Charred's own EyeGlow particle systems are cloned onto the puppet's head at the position set by the FableArcherEye* settings below.
# Setting type: Boolean
# Default value: true
FableArcherEyeGlow = true

## Sideways offset of the eye-glow pair from the head bone, in meters (face's right direction; negative = left). Applies to both eyes together - use FableArcherEyeSeparation to spread them apart.
# Setting type: Single
# Default value: 0.005
# Acceptable value range: From -0.5 to 0.5
FableArcherEyeOffsetX = 0.005

## Vertical offset of the eye-glow pair from the head bone, in meters (up positive).
# Setting type: Single
# Default value: 0.15
# Acceptable value range: From -0.5 to 0.5
FableArcherEyeOffsetY = 0.15

## Forward/back offset of the eye-glow pair from the head bone, in meters (toward the face positive). Push forward until the glow clears the face instead of being buried in the skull.
# Setting type: Single
# Default value: 0.22
# Acceptable value range: From -0.5 to 0.5
FableArcherEyeOffsetZ = 0.22

## Distance between the two eye glows, in meters.
# Setting type: Single
# Default value: 0.1
# Acceptable value range: From 0 to 0.4
FableArcherEyeSeparation = 0.1

## Size multiplier for each eye glow. 1.0 = the vanilla Charred glow size.
# Setting type: Single
# Default value: 2
# Acceptable value range: From 0.1 to 3
FableArcherEyeScale = 2

## Brightness of the white eye glow (material tint alpha; 0 = invisible, 5 = max).
# Setting type: Single
# Default value: 5
# Acceptable value range: From 0 to 5
FableArcherEyeIntensity = 5

